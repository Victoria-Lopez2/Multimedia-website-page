<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Images for Project 1.">
    <title>Project 1 Image Gallery</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18201f;
            --paper: #f5f5ef;
            --muted: #626b67;
            --line: #d7dcd5;
            --accent: #d8f36a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            color: var(--ink);
            background: var(--paper);
            font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        header, main, footer { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }

        .topbar {
            display: flex;
            min-height: 68px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        .brand { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
        .brand span { color: #687d11; }
        .back-link { font-size: 14px; text-underline-offset: 4px; }

        .page-heading { padding: 64px 0 32px; }
        .eyebrow { margin: 0 0 10px; color: #b34c38; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(40px, 7vw, 72px); font-weight: 400; line-height: 1.05; }
        .page-heading p:last-child { max-width: 600px; margin: 16px 0 0; color: var(--muted); }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
            gap: 24px;
            padding: 16px 0 72px;
        }

        figure { min-width: 0; margin: 0; }

        figure img {
            display: block;
            width: 100%;
            height: 250px;
            padding: 10px;
            border: 1px solid var(--line);
            background: #e8ebe4;
            object-fit: contain;
        }

        figcaption { padding-top: 10px; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }

        footer { padding: 18px 0 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

        @media (max-width: 520px) {
            header, main, footer { width: calc(100% - 32px); }
            .topbar { align-items: flex-start; flex-direction: column; justify-content: center; gap: 8px; padding: 14px 0; }
            .page-heading { padding-top: 44px; }
            .gallery { gap: 20px; }
            figure img { height: 220px; }
        }
    </style>
</head>
<body>
    <header>
        <nav class="topbar" aria-label="Page navigation">
            <a class="brand" href="index.html"><span>M/01</span> Multimedia Systems</a>
            <a class="back-link" href="index.html">Back to home</a>
        </nav>
    </header>
    <main>
        <section class="page-heading" aria-labelledby="gallery-title">
            <p class="eyebrow">Multimedia Systems / Project 1</p>
            <h1 id="gallery-title">Image gallery</h1>
            <p>All project images, including source artwork and horizontal and vertical grid studies.</p>
        </section>
        <section class="gallery" aria-label="Project image files">
            <figure><img src="images/1_source.png" alt="Original source for set 1" loading="lazy"><figcaption>1_source.png</figcaption></figure>
            <figure><img src="images/1_3x3_horizontal.png" alt="Set 1 arranged in a horizontal 3 by 3 grid" loading="lazy"><figcaption>1_3x3_horizontal.png</figcaption></figure>
            <figure><img src="images/1_3x3_vertical.png" alt="Set 1 arranged in a vertical 3 by 3 grid" loading="lazy"><figcaption>1_3x3_vertical.png</figcaption></figure>
            <figure><img src="images/1_5x5_horizontal.png" alt="Set 1 arranged in a horizontal 5 by 5 grid" loading="lazy"><figcaption>1_5x5_horizontal.png</figcaption></figure>
            <figure><img src="images/1_5x5_vertical.png" alt="Set 1 arranged in a vertical 5 by 5 grid" loading="lazy"><figcaption>1_5x5_vertical.png</figcaption></figure>
            <figure><img src="images/grayscale-image_source.png" alt="Original grayscale source" loading="lazy"><figcaption>grayscale-image_source.png</figcaption></figure>
            <figure><img src="images/grayscale-image_3x3_horizontal.png" alt="Grayscale study arranged in a horizontal 3 by 3 grid" loading="lazy"><figcaption>grayscale-image_3x3_horizontal.png</figcaption></figure>
            <figure><img src="images/grayscale-image_3x3_vertical.png" alt="Grayscale study arranged in a vertical 3 by 3 grid" loading="lazy"><figcaption>grayscale-image_3x3_vertical.png</figcaption></figure>
            <figure><img src="images/grayscale-image_5x5_horizontal.png" alt="Grayscale study arranged in a horizontal 5 by 5 grid" loading="lazy"><figcaption>grayscale-image_5x5_horizontal.png</figcaption></figure>
            <figure><img src="images/grayscale-image_5x5_vertical.png" alt="Grayscale study arranged in a vertical 5 by 5 grid" loading="lazy"><figcaption>grayscale-image_5x5_vertical.png</figcaption></figure>
            <figure><img src="images/unesco-1_source.png" alt="Original UNESCO source" loading="lazy"><figcaption>unesco-1_source.png</figcaption></figure>
            <figure><img src="images/unesco-1_3x3_horizontal.png" alt="UNESCO study arranged in a horizontal 3 by 3 grid" loading="lazy"><figcaption>unesco-1_3x3_horizontal.png</figcaption></figure>
            <figure><img src="images/unesco-1_3x3_vertical.png" alt="UNESCO study arranged in a vertical 3 by 3 grid" loading="lazy"><figcaption>unesco-1_3x3_vertical.png</figcaption></figure>
            <figure><img src="images/unesco-1_5x5_horizontal.png" alt="UNESCO study arranged in a horizontal 5 by 5 grid" loading="lazy"><figcaption>unesco-1_5x5_horizontal.png</figcaption></figure>
            <figure><img src="images/unesco-1_5x5_vertical.png" alt="UNESCO study arranged in a vertical 5 by 5 grid" loading="lazy"><figcaption>unesco-1_5x5_vertical.png</figcaption></figure>
        </section>
    </main>
    <footer>15 image files / Project 1</footer>
</body>
</html>
